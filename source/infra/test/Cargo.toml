[package]
name = "infra-test"
version = "0.1.0"
edition = "2024"

[dependencies]
infra-flatcar = { path = "../../spaghettinuum/source/infra/flatcar" }
serde_json = "1"
terrars = "0.4"
terrars-andrewbaxter-dinker = { version = "0.5", features = ["image"] }
terrars-dnsimple-dnsimple = { version = "0.4", features = ["zone_record"] }
terrars-hashicorp-random = { version = "0.3", features = ["id", "password"] }
terrars-hashicorp-google = { version = "0.3", git = "https://github.com/andrewbaxter/terrars-hashicorp-google", rev = "823e225a0cf3e2c1ced98875e6ea1d5ddaee5e22", features = [
    "project_service",
    "compute_network",
    "compute_subnetwork",
    "compute_firewall",
    "compute_disk",
    "compute_address",
    "compute_instance",
    "artifact_registry_repository",
    "artifact_registry_repository_iam_binding",
    "service_account",
    "service_account_key",
    "secret_manager_secret",
    "secret_manager_secret_version",
    "secret_manager_secret_iam_member",
] }

[lints.clippy]
all = "allow"
