[package]
name = "wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1"
ezing = "0.2"
gloo = { version = "0.12", features = ["futures"] }
gloo-events = "0.1"
js-sys = "0.3"
reqwasm = { version = "0.5", features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = { version = "0.4", features = [
    "futures-core-03-stream",
] }
web-sys = { version = "0.3", features = [
    "Cache",
    "Blob",
    "BlobEvent",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "HtmlOptionElement",
    "MediaRecorder",
    "MediaRecorderOptions",
    "PointerEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "HtmlCanvasElement",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "CacheStorage",
    "WindowClient",
    "Client",
    "Clients",
    "ClientQueryOptions",
    "Clipboard",
    "ClipboardItem",
    "CssStyleDeclaration",
    "Document",
    "DomException",
    "DomParser",
    "DomRect",
    "ExtendableEvent",
    "FetchEvent",
    "History",
    "HtmlAudioElement",
    "HtmlDocument",
    "HtmlHeadingElement",
    "HtmlIFrameElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "HtmlVideoElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "KeyboardEvent",
    "Location",
    "MediaMetadata",
    "MediaQueryList",
    "MediaSession",
    "MediaSessionAction",
    "MessageEvent",
    "MouseEvent",
    "MediaError",
    "Navigator",
    "NodeList",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "PushEvent",
    "PushManager",
    "PushMessageData",
    "PushSubscription",
    "PushSubscriptionJson",
    "PushSubscriptionOptionsInit",
    "Range",
    "Selection",
    "ServiceWorkerContainer",
    "ServiceWorkerGlobalScope",
    "ServiceWorkerRegistration",
    "StorageManager",
    "SupportedType",
    "Url",
    "VisibilityState",
    "WheelEvent",
    "WorkerLocation",
    "WritableStream",
] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
hex = "0.4"
defer = "0.2"
shared = { path = "../shared" }
sha2 = "0.11"
lunk = { version = "0.3" }
rooting = { version = "0.2", features = ["futures"] }
rooting-forms = { version = "0.4", features = ["jiff"] }
urlencoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = { version = "0.11", default-features = false }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
serde_urlencoded = "0.7"
async-trait = "0.1"
flowcontrol = "0.2"
structre = "0.2"
by_address = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
mime2ext = "0.1"
spaghettinuum = { path = "../spaghettinuum/source/shared" }
jiff = { version = "0.2", features = ["serde", "js"] }
similar = { version = "2", features = ["inline"] }
malarkdowney = "0.3"

[build-dependencies]
convert_case = "0.12"
genemichaels-lib = "0.12"
proc-macro2 = "1"
quote = "1"

[profile.release]
# Voodoo https://github.com/johnthagen/min-sized-rust
strip = true
lto = true
codegen-units = 1

[lints.clippy]
all = "allow"
