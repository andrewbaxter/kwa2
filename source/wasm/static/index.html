<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-icon-180.png" />
    <title>Kwa</title>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", (ev) => {
          const reload = ev.data?.reload;
          if (reload != null) {
            console.log(`Reloading at service worker request: ${reload.reason}`);
            location.reload();
          }
        });
        navigator.serviceWorker.register("./serviceworker_entry.js").catch((e) => {
          console.log(`Error registering service worker`, e);
        });
      }
    </script>
    <script src="v/KWA_VERSION/style.js"></script>
    <link
      rel="preload"
      href="v/KWA_VERSION/main_bg.wasm"
      as="fetch"
      type="application/wasm"
      crossorigin=""
    />
    <link rel="modulepreload" href="v/KWA_VERSION/main.js" />
    <script type="module">
      import init from "./v/KWA_VERSION/main.js";
      init("./v/KWA_VERSION/main_bg.wasm");
      // Console errors due to https://github.com/rustwasm/wasm-bindgen/issues/2470
    </script>
  </head>

  <body></body>
</html>
