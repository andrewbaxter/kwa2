[package]
name = "native"
version = "0.1.0"
edition = "2024"

[dependencies]
aargvark = { version = "0.13", features = ["serde_json"] }
flowcontrol = "0.2"
glove = "0.5"
good-ormning = { version = "0.7.0", features = ["jiff", "sqlite"] }
http = "1"
htwrap = "0.18.1"
loga = "0.5"
schemars = { version = "1", features = ["jiff02"] }
serde = { version = "1", features = ["derive"] }
taskmanager = "0.6"
tokio = { version = "1", features = ["rt", "sync", "macros", "fs"] }
tokio-stream = { version = "0.1" }
rust-embed-for-web = { version = "11", features = ["always-embed"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
rand = "0.10"
spaghettinuum = { path = "../spaghettinuum/source/shared" }
spaghettinuum_native = { path = "../spaghettinuum/source/native" }
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.37", features = ["array", "bundled"] }
deadpool-sqlite = "0.12"
shared = { path = "../shared" }
openidconnect = { version = "4", default-features = false }
cookie = { version = "0.18" }
ts-rs = { version = "12", features = ["serde-json-impl"] }
moka = { version = "0.12", features = ["future"] }
http-serde = "2"
serde_urlencoded = "0.7"
hyper-tungstenite = { version = "0.30" }
hyper-util = "0.1"
hyper = "1"
http-body-util = "0.1"
futures = "0.3"
web-push = { version = "0.11", default-features = false }
base64 = "0.23"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
fdap = { version = "0.2" }
rustls = "0.23"
tokio-rustls = "0.26"

[build-dependencies]
good-ormning = { version = "0.7.0", features = ["jiff", "sqlite"] }

[lints.clippy]
all = "allow"

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
